# Taskfile configuration
# Path: presets/detection.yml
# Description: Auto-detection of project stacks and tools
#
# Usage:
# 1. Auto-detection (default):
#    includes:
#      detection: { taskfile: .../detection.yml }
#
# 2. Manual override specific tools:
#    includes:
#      detection: { taskfile: .../detection.yml }
#    vars:
#      ENABLE_TYPESCRIPT: true   # Override auto-detection
#
# 3. Disable all auto-detection:
#    includes:
#      detection: { taskfile: .../detection.yml }
#    vars:
#      AUTO_DETECT: false
#      # Then manually set what you want
#      ENABLE_TYPESCRIPT: true

version: "3"

vars:
  # ============================================================================
  # Control Variables
  # ============================================================================

  # Set to "false" in parent Taskfile to disable all auto-detection
  # Parent Taskfile vars take precedence, so this default can be overridden
  AUTO_DETECT: '{{.AUTO_DETECT | default "true"}}'

  # ============================================================================
  # Language/Stack Detection
  # ============================================================================

  # TypeScript/JavaScript detection
  # Parent can override by setting ENABLE_TYPESCRIPT directly in their vars
  ENABLE_TYPESCRIPT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "package.json" ] && ([ -f "tsconfig.json" ] || grep -q '"typescript"' package.json 2>/dev/null); then
        echo "true"
      else
        echo "false"
      fi

  ENABLE_JAVASCRIPT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "package.json" ]; then
        echo "true"
      else
        echo "false"
      fi

  # Python detection
  ENABLE_PYTHON:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.txt" ]; then
        echo "true"
      else
        echo "false"
      fi

  # Rust detection
  ENABLE_RUST:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "Cargo.toml" ]; then
        echo "true"
      else
        echo "false"
      fi

  # Go detection
  ENABLE_GO:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "go.mod" ]; then
        echo "true"
      else
        echo "false"
      fi

  # ============================================================================
  # Tool Detection (TypeScript/JavaScript Ecosystem)
  # ============================================================================

  # Biome (linter/formatter)
  ENABLE_BIOME:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "biome.json" ] || [ -f "biome.jsonc" ] || grep -q '"@biomejs/biome"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # ESLint
  ENABLE_ESLINT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || grep -q '"eslint"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # Prettier
  ENABLE_PRETTIER:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f ".prettierrc" ] || [ -f ".prettierrc.json" ] || [ -f "prettier.config.js" ] || grep -q '"prettier"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # TypeScript Compiler
  ENABLE_TSC:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "tsconfig.json" ]; then
        echo "true"
      else
        echo "false"
      fi

  # Vitest (test framework)
  ENABLE_VITEST:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "vitest.config.ts" ] || [ -f "vitest.config.js" ] || grep -q '"vitest"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # Jest (test framework)
  ENABLE_JEST:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "jest.config.js" ] || [ -f "jest.config.ts" ] || grep -q '"jest"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # tsup (bundler)
  ENABLE_TSUP:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "tsup.config.ts" ] || grep -q '"tsup"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # TypeDoc (documentation)
  ENABLE_TYPEDOC:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "typedoc.json" ] || [ -f "typedoc.config.ts" ] || grep -q '"typedoc"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # VitePress (documentation)
  ENABLE_VITEPRESS:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -d "docs/.vitepress" ] || grep -q '"vitepress"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # ============================================================================
  # Tool Detection (Python Ecosystem)
  # ============================================================================

  # Ruff (linter/formatter)
  ENABLE_RUFF:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "ruff.toml" ] || [ -f ".ruff.toml" ] || grep -q 'tool.ruff' pyproject.toml 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # mypy (type checker)
  ENABLE_MYPY:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "mypy.ini" ] || [ -f ".mypy.ini" ] || grep -q 'tool.mypy' pyproject.toml 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # pytest (test framework)
  ENABLE_PYTEST:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "pytest.ini" ] || grep -q 'tool.pytest' pyproject.toml 2>/dev/null || grep -q 'pytest' requirements.txt 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # ============================================================================
  # Tool Detection (Rust Ecosystem)
  # ============================================================================

  # Clippy (linter)
  ENABLE_CLIPPY:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "Cargo.toml" ]; then
        echo "true"
      else
        echo "false"
      fi

  # rustfmt (formatter)
  ENABLE_RUSTFMT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "Cargo.toml" ]; then
        echo "true"
      else
        echo "false"
      fi

  # ============================================================================
  # Tool Detection (Go Ecosystem)
  # ============================================================================

  # golangci-lint (linter)
  ENABLE_GOLANGCI_LINT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f ".golangci.yml" ] || [ -f ".golangci.yaml" ]; then
        echo "true"
      else
        echo "false"
      fi

  # gofmt (formatter)
  ENABLE_GOFMT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "go.mod" ]; then
        echo "true"
      else
        echo "false"
      fi

  # ============================================================================
  # Universal Tool Detection
  # ============================================================================

  # Git
  ENABLE_GIT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -d ".git" ]; then
        echo "true"
      else
        echo "false"
      fi

  # commitlint
  ENABLE_COMMITLINT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f ".commitlintrc.json" ] || [ -f "commitlint.config.js" ] || grep -q '"@commitlint' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # lefthook (git hooks)
  ENABLE_LEFTHOOK:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "lefthook.yml" ] || grep -q '"lefthook"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # markdownlint
  ENABLE_MARKDOWNLINT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f ".markdownlint.json" ] || [ -f ".markdownlint-cli2.jsonc" ] || grep -q '"markdownlint' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

  # yamllint
  ENABLE_YAMLLINT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f ".yamllint" ] || [ -f ".yamllint.yml" ]; then
        echo "true"
      else
        echo "false"
      fi

  # shellcheck
  ENABLE_SHELLCHECK:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f ".shellcheckrc" ] || find . -type f -name "*.sh" 2>/dev/null | grep -q .; then
        echo "true"
      else
        echo "false"
      fi

  # shfmt (shell formatter)
  ENABLE_SHFMT:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif find . -type f -name "*.sh" 2>/dev/null | grep -q .; then
        echo "true"
      else
        echo "false"
      fi

  # taplo (TOML formatter)
  ENABLE_TAPLO:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f "taplo.toml" ] || find . -type f -name "*.toml" 2>/dev/null | grep -q .; then
        echo "true"
      else
        echo "false"
      fi

  # cspell (spell checker)
  ENABLE_CSPELL:
    sh: |
      if [ "{{.AUTO_DETECT}}" != "true" ]; then
        echo "false"
      elif [ -f ".cspell.json" ] || [ -f "cspell.json" ] || grep -q '"cspell"' package.json 2>/dev/null; then
        echo "true"
      else
        echo "false"
      fi

tasks:
  info:
    desc: Display detected project configuration
    cmds:
      - |
        echo "=========================================="
        echo "Taskfiles Detection Report"
        echo "=========================================="
        echo ""
        echo "Auto-detection: {{.AUTO_DETECT}}"
        echo ""
        echo "Language/Stack Detection:"
        echo "  TypeScript:  {{.ENABLE_TYPESCRIPT}}"
        echo "  JavaScript:  {{.ENABLE_JAVASCRIPT}}"
        echo "  Python:      {{.ENABLE_PYTHON}}"
        echo "  Rust:        {{.ENABLE_RUST}}"
        echo "  Go:          {{.ENABLE_GO}}"
        echo ""
        echo "TypeScript/JavaScript Tools:"
        echo "  Biome:       {{.ENABLE_BIOME}}"
        echo "  ESLint:      {{.ENABLE_ESLINT}}"
        echo "  Prettier:    {{.ENABLE_PRETTIER}}"
        echo "  TSC:         {{.ENABLE_TSC}}"
        echo "  Vitest:      {{.ENABLE_VITEST}}"
        echo "  Jest:        {{.ENABLE_JEST}}"
        echo "  tsup:        {{.ENABLE_TSUP}}"
        echo "  TypeDoc:     {{.ENABLE_TYPEDOC}}"
        echo "  VitePress:   {{.ENABLE_VITEPRESS}}"
        echo ""
        echo "Python Tools:"
        echo "  Ruff:        {{.ENABLE_RUFF}}"
        echo "  mypy:        {{.ENABLE_MYPY}}"
        echo "  pytest:      {{.ENABLE_PYTEST}}"
        echo ""
        echo "Rust Tools:"
        echo "  Clippy:      {{.ENABLE_CLIPPY}}"
        echo "  rustfmt:     {{.ENABLE_RUSTFMT}}"
        echo ""
        echo "Go Tools:"
        echo "  golangci-lint: {{.ENABLE_GOLANGCI_LINT}}"
        echo "  gofmt:       {{.ENABLE_GOFMT}}"
        echo ""
        echo "Universal Tools:"
        echo "  Git:         {{.ENABLE_GIT}}"
        echo "  commitlint:  {{.ENABLE_COMMITLINT}}"
        echo "  lefthook:    {{.ENABLE_LEFTHOOK}}"
        echo "  markdownlint: {{.ENABLE_MARKDOWNLINT}}"
        echo "  yamllint:    {{.ENABLE_YAMLLINT}}"
        echo "  shellcheck:  {{.ENABLE_SHELLCHECK}}"
        echo "  shfmt:       {{.ENABLE_SHFMT}}"
        echo "  taplo:       {{.ENABLE_TAPLO}}"
        echo "  cspell:      {{.ENABLE_CSPELL}}"
        echo ""
        echo "=========================================="
